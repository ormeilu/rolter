name: audit

# scheduled supply-chain audit. cargo-deny runs on every PR (quality.yml) against
# the committed lockfile, but new RUSTSEC advisories land on already-merged code
# with no PR to trigger them. this runs daily so a fresh advisory on master
# surfaces as a failing scheduled run (and an issue) rather than sitting unseen.
on:
  schedule:
    # every day at 07:00 UTC
    - cron: "0 7 * * *"
  # allow a manual run from the actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
