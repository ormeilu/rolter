image:
  repository: ghcr.io/rolter-ai/rolter
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

gateway:
  replicaCount: 2
  service:
    type: ClusterIP
    port: 4000
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  extraEnv: []

control:
  replicaCount: 1
  # address the control plane binds inside the pod. Must stay reachable from
  # the Service, so it is not loopback here — which means an admin token is
  # required: with none set the control plane refuses to start rather than
  # serve an unauthenticated management API to the cluster (#970). Supply one
  # through `secretEnv` as ROLTER_ADMIN_TOKEN.
  host: 0.0.0.0
  service:
    type: ClusterIP
    port: 4001
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  extraEnv: []

config:
  existingConfigMap: ""
  file: |
    [server]
    host = "0.0.0.0"
    port = 4000

    [[providers]]
    name = "local"
    kind = "openai_compatible"
    api_base = "http://vllm:8000"

    [[routes]]
    model = "default"
    strategy = "round_robin"

    [[routes.targets]]
    provider = "local"

env:
  rustLog: info
  databaseUrl: ""
  redisUrl: ""
  clickhouseUrl: ""

secretEnv: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rolter.local
      paths:
        - path: /
          pathType: Prefix
          service: gateway
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# pre-boot validation (#854). an initContainer runs `rolter check` against the
# exact environment the workload will get, so a misconfigured release fails at
# rollout instead of starting degraded. the pod never becomes ready if it fails.
preflight:
  enabled: true
  # fail on warnings too — see the template for why this is the default
  strict: true
  # also probe that the datastores accept a TCP connection. off by default: it
  # turns a config check into a network check, and a transient DNS blip during a
  # rollout would then block a release that is fine
  connect: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
