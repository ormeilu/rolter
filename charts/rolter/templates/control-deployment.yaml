{{- $controlEnv := include "rolter.controlEnv" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rolter.fullname" . }}-control
  labels:
    {{- include "rolter.labels" . | nindent 4 }}
    app.kubernetes.io/component: control
spec:
  replicas: {{ .Values.control.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rolter.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rolter.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: control
    spec:
      serviceAccountName: {{ include "rolter.serviceAccountName" . }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "rolter.preflight" (dict "root" . "env" $controlEnv) | nindent 6 }}
      containers:
        - name: control
          image: {{ include "rolter.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["rolter-control"]
          args: ["--gateway-url", "http://{{ include "rolter.fullname" . }}-gateway:{{ .Values.gateway.service.port }}"]
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 4001
          env:
          env: {{- $controlEnv | nindent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          resources: {{ toYaml .Values.control.resources | nindent 12 }}
